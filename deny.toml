[graph]
all-features = true

[advisories]
yanked = "warn"
unmaintained = "workspace"
ignore = [
    # The core types, scheduler, controller, CLI, Raft log and accounting
    # database use chrono's types, so moving off it is a migration of its own.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained and has no fixed release" },
]
[licenses]
confidence-threshold = 0.8

allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
