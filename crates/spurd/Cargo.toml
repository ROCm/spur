[package]
name = "spurd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "spurd"
path = "src/lib.rs"

[[bin]]
name = "spurd"
path = "src/main.rs"

[dependencies]
spur-proto = { path = "../spur-proto" }
spur-client = { path = "../spur-client" }
spur-core = { path = "../spur-core" }
spur-update = { path = "../spur-update" }
spur-net = { path = "../spur-net" }
spur-sched = { path = "../spur-sched" }
spur-spank = { path = "../spur-spank" }
spur-devices = { path = "../spur-devices" }
tokio = { workspace = true }
tonic = { workspace = true }
# agent-side auth middleware (Tower layer over the gRPC surface)
http = { workspace = true }
tower = { workspace = true }
prost-types = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
nix = { workspace = true, features = ["dir"] }
libloading = { workspace = true }
libc = "0.2"
hostname = { workspace = true }
tokio-stream = { workspace = true }
shlex = { workspace = true }
subtle = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tonic-health = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }

[lints]
workspace = true
