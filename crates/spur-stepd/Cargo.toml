[package]
name = "spur-stepd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "spurstepd"
path = "src/main.rs"

[dependencies]
# Reuses spurd's job-launch primitives (executor, container, stepd
# supervision) as a library. The spurd lib also carries the agent RPC, k0s,
# and mesh code, so spurstepd depends on it at build time but never runs it.
spurd = { path = "../spurd" }
spur-core = { path = "../spur-core" }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
