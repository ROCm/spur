# bandit configuration
# Reference: https://bandit.readthedocs.io/en/latest/config.html
# Local scan: bandit --recursive . --configfile .github/scan_tools_configs/bandit.yml
#
# Bandit configuration for this repository's security scans.
#
# This file defines the complete scanner policy;
# Keep repository-specific suppressions and tuning here.

# Environment and generated-output exclusions support local scans; these
# paths are absent from clean CI checkouts.
exclude_dirs:
  - .git
  - .venv
  - venv
  - build
  - dist
  - node_modules

# The repository's Python is test harness that drives the Spur CLIs as
# subprocesses by name, so these fire on every helper. Shell-injection checks
# (B602, B605) stay on. Bandit cannot scope a skip to a path.
skips:
  - B404
  - B603
  - B607

# pytest reports failures through bare asserts, so B101 is noise under tests.
# The leading */ also matches the baseline's .scan-target/ checkout prefix.
assert_used:
  skips:
    - "*/tests/*"
    - "tests/*"
