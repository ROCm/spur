#
# Security gate: scans what each pull request changes, and everything on
# main after each push. Scanner selection and policy are defined by the
# pinned ROCm/rocm-security-gh `security-baseline.yml` reusable workflow.
#
# Findings go to code scanning as SARIF, never to logs or the job summary,
# which are public. Same-repo PRs also get the baseline's findings comment.
# Push scans keep main's analysis current, which code scanning compares PR
# results against, and cover anything that reached main without a PR scan.
# See nightly-security.yml for the scheduled scan.

name: Security

on:
  pull_request:
    # Spelled out the default to avoid confusion.
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A running push scan always finishes. A queued one may be replaced by a
  # newer push, whose full scan covers everything the replaced one would.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  baseline:
    # A reusable workflow cannot grant itself more than its caller does.
    permissions:
      actions: read
      contents: read
      pull-requests: write
      security-events: write
    uses: ROCm/rocm-security-gh/.github/workflows/security-baseline.yml@f92f9387d10fe91a0293762bdcefd3ba012a827b # v1.0.7
    with:
      # A push's changed range is unreliable after a force push.
      scan_mode: ${{ github.event_name == 'push' && 'all' || 'changed' }}
      report_formats: sarif
      bandit_config_path: .github/scan_tools_configs/bandit.yml
      gitleaks_config_path: .github/scan_tools_configs/gitleaks.toml
      trivy_config_path: .github/scan_tools_configs/trivy.yml
      zizmor_config_path: .github/scan_tools_configs/zizmor.yml

  # The baseline's PR-time trivy only runs when a lockfile, manifest or
  # Dockerfile changes, so a PR that weakens examples/k8s would pass.
  manifests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan Kubernetes manifests and Dockerfiles for misconfigurations
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: config
          scan-ref: .
          trivy-config: .github/scan_tools_configs/trivy.yml
          trivyignores: .trivyignore
          format: sarif
          output: trivy-manifests.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Upload SARIF to code scanning
        # Fork PRs get a read-only token; the scan above still gates them.
        if: >-
          always() && steps.scan.outcome != 'skipped' &&
          (github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-manifests.sarif
          category: trivy-manifests
