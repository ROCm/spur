#
# Nightly security scan: scans the whole repository and the shipped image
# and pushes SARIF findings to the repository's code-scanning Security tab.
# Complements `security.yml`, which scans on PRs and pushes to main; this
# catches new findings in unchanged code, such as newly published CVEs.

name: Nightly Security

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    # Forks inherit the schedule but have no code scanning to report to.
    if: github.event.repository.fork == false
    # Only the job that uploads SARIF gets write access to code scanning.
    permissions:
      contents: read
      security-events: write
    uses: ROCm/rocm-security-gh/.github/workflows/security-baseline.yml@35d3060c4b2ed48f950f85bd414a1302a431fc0b # v1.0.8
    with:
      scan_mode: all
      report_formats: sarif
      bandit_config_path: .github/scan_tools_configs/bandit.yml
      gitleaks_config_path: .github/scan_tools_configs/gitleaks.toml
      trivy_config_path: .github/scan_tools_configs/trivy.yml
      zizmor_config_path: .github/scan_tools_configs/zizmor.yml

  # The baseline scans the source tree, not the OS packages in the shipped
  # image, so new CVEs there only surface from rescanning the image itself.
  # Scan the published tag, not a rebuild: a rebuild applies the latest apt
  # fixes and would hide CVEs still present in what users pull.
  image:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy
        uses: $/.github/actions/install-trivy

      - name: Scan image for vulnerabilities and secrets
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: docker.io/rocm/spur:nightly
          scanners: vuln,secret
          format: sarif
          output: trivy-nightly.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "0"

      - name: Upload SARIF to GitHub Security
        if: always() && steps.scan.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-nightly.sarif
          category: trivy-nightly
