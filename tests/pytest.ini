[pytest]
pythonpath = native_host/e2e k8s/e2e
testpaths = native_host/e2e k8s/e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Sequential execution (pytest default). Do not use pytest-xdist here.
addopts = -p no:xdist
markers =
    rootful: run the cluster fixture with spurd as root (via sudo)
    gpu: requires GPU hardware on the nodes (auto-applied to tests using GPU fixtures)
    k0s: native spur-managed k0s cluster tests (rootful spurd + systemd + etcd; slow); run last in each shard
    quarantine: known-flaky test blocked on a product bug; runs as non-strict xfail, never retried (requires reason=...)
