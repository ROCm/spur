apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spur-operator
rules:
  # Pod management
  - apiGroups: [""]
    resources: [pods, pods/status, pods/log]
    verbs: [get, list, watch, create, update, patch, delete]
  # Service management (headless services for inter-pod networking)
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, update, patch, delete]
  # Node watching
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  # ConfigMaps
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  # Events
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  # SpurJob CRD
  - apiGroups: [spur.amd.com]
    resources: [spurjobs, spurjobs/status, spurjobs/finalizers]
    verbs: [get, list, watch, create, update, patch, delete]
  # PodDisruptionBudgets
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  # Quota projection (--enable-quota): one Namespace, ResourceQuota, LimitRange,
  # Role and RoleBinding per Spur account.
  - apiGroups: [""]
    resources: [namespaces, resourcequotas, limitranges, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  # RBAC self-protection means granting a Role requires already holding its
  # verbs, or escalate/bind.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete, escalate, bind]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/exec, pods/attach, pods/portforward, secrets, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spur-operator
subjects:
  - kind: ServiceAccount
    name: default
    namespace: spur
roleRef:
  kind: ClusterRole
  name: spur-operator
  apiGroup: rbac.authorization.k8s.io
