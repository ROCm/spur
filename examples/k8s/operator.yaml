apiVersion: v1
kind: Service
metadata:
  name: spur-k8s-operator
  namespace: spur
spec:
  selector:
    app: spur-k8s-operator
  ports:
    - name: grpc
      port: 6818
      targetPort: 6818
    - name: health
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spur-k8s-operator
  namespace: spur
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spur-k8s-operator
  template:
    metadata:
      labels:
        app: spur-k8s-operator
    spec:
      serviceAccountName: spur-operator
      containers:
        - name: operator
          image: rocm/spur:0.16.0 # x-release-please-version
          command: [spur-k8s-operator]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          args:
            - --controller-addr=spurctld.spur.svc.cluster.local:6817
            - --listen=[::]:6818
            - --health-addr=[::]:8080
            # Authenticate the virtual-agent surface (port 6818), which carries a cluster-wide
            # pod-create privilege. "permissive" (default) verifies a credential when presented and
            # otherwise logs+allows — the migration default. Move to "required" once the controller
            # presents a credential, and set --jwt-key / SPUR_JWT_KEY (below) to the cluster
            # [auth] jwt_key so credentials verify. required + no key refuses to start.
            # - --auth-mode=required
          env:
            # Cluster JWT signing key the operator verifies agent credentials against; must match the
            # controllers' [auth] jwt_key. Source it from a Secret rather than inlining it.
            # - name: SPUR_JWT_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: spur-auth
            #       key: jwt_key
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SPUR_OPERATOR_ADDRESS
              value: "spur-k8s-operator.$(POD_NAMESPACE).svc.cluster.local"
          ports:
            - containerPort: 6818
              name: grpc
            - containerPort: 8080
              name: health
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
