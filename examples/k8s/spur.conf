cluster_name = "spur-k8s"

[controller]
# Raft peers use StatefulSet DNS names on the dedicated Raft port.
# node_id is auto-derived from each pod's position in this peers list
# (its hostname matched against each entry), so it never needs to be set.
peers = [
  "spurctld-0.spurctld.spur.svc.cluster.local:6821",
  "spurctld-1.spurctld.spur.svc.cluster.local:6821",
  "spurctld-2.spurctld.spur.svc.cluster.local:6821",
]

[scheduler]
interval_secs = 2
max_jobs_per_cycle = 100
plugin = "backfill"
# Among preemption victims of equal QOS priority the default is the lowest-named
# node first. Optionally rank them by fair-share instead, only among jobs that are
# already eligible (usage_share measures capacity actually consumed in every QOS and
# ignores QOS usage_factor). Unset (the default) keeps node-name order.
# preempt_victim_order = ["usage_share", "preempt_burden", "hash"]
# preempt_burden_window_hours = 24

[accounting]
# Fill in the real URL, with its password, and put this whole file in the
# Secret spur-config that spurctld.yaml mounts. Leave empty to run without
# accounting.
database_url = ""

[[partitions]]
name = "default"
state = "UP"
default = true
nodes = "ALL"
max_time = "7d"
default_time = "1h"
