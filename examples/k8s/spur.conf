cluster_name = "spur-k8s"

[controller]
# Raft peers use StatefulSet DNS names on the dedicated Raft port.
# node_id is auto-derived from each pod's position in this peers list
# (its hostname matched against each entry), so it never needs to be set.
peers = [
  "spurctld-0.spurctld.spur.svc.cluster.local:6821",
  "spurctld-1.spurctld.spur.svc.cluster.local:6821",
  "spurctld-2.spurctld.spur.svc.cluster.local:6821",
]

[metrics]
# The kubelet reaches /healthz and /readyz on this port from outside the
# Pod's loopback, so the default "loopback" bind would fail every probe.
# This publishes the metrics endpoints to the Pod network as well.
bind = "all"
listen_addr = "[::]:6822"

[scheduler]
interval_secs = 2
max_jobs_per_cycle = 100
plugin = "backfill"

[accounting]
# Fill in the real URL, with its password, and put this whole file in the
# Secret spur-config that spurctld.yaml mounts. Leave empty to run without
# accounting.
database_url = ""

[[partitions]]
name = "default"
state = "UP"
default = true
nodes = "ALL"
max_time = "7d"
default_time = "1h"
