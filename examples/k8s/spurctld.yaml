apiVersion: v1
kind: Service
metadata:
  name: spurctld
  namespace: spur
spec:
  selector:
    app: spurctld
  ports:
    - name: grpc
      port: 6817
      targetPort: 6817
    - name: rest
      port: 6820
      targetPort: 6820
    - name: raft
      port: 6821
      targetPort: 6821
  clusterIP: None  # headless for StatefulSet peer DNS
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spurctld
  namespace: spur
spec:
  serviceName: spurctld
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: spurctld
  template:
    metadata:
      labels:
        app: spurctld
    spec:
      # spurctld never calls the Kubernetes API, so it gets no token to leak.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spurctld
          image: rocm/spur:0.16.0 # x-release-please-version
          command: [spurctld]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          args:
            - --listen=[::]:6817
            - --config=/etc/spur/spur.conf
          ports:
            - containerPort: 6817
              name: grpc
            - containerPort: 6820
              name: rest
            - containerPort: 6821
              name: raft
          volumeMounts:
            - name: config
              mountPath: /etc/spur
            - name: spool
              mountPath: /var/spool/spur
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: 6817
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6817
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          # spur.conf carries accounting.database_url, which holds a password, so
          # the running config is a Secret. Fill in examples/k8s/spur.conf and
          # build the Secret from it:
          #   kubectl create secret generic spur-config \
          #     --from-file=spur.conf=examples/k8s/spur.conf -n spur
          secret:
            secretName: spur-config
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: spool
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
