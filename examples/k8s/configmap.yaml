apiVersion: v1
kind: ConfigMap
metadata:
  # A readable template only. spurctld.yaml mounts the Secret "spur-config"
  # that you build from this file, because spur.conf carries a password.
  name: spur-config-template
  namespace: spur
data:
  spur.conf: |
    cluster_name = "spur-k8s"

    [controller]
    # Raft peers use StatefulSet DNS names on the dedicated Raft port.
    # node_id is auto-derived from each pod's position in this peers list
    # (its hostname matched against each entry), so it never needs to be set.
    peers = [
      "spurctld-0.spurctld.spur.svc.cluster.local:6821",
      "spurctld-1.spurctld.spur.svc.cluster.local:6821",
      "spurctld-2.spurctld.spur.svc.cluster.local:6821",
    ]

    [scheduler]
    interval_secs = 2
    max_jobs_per_cycle = 100
    plugin = "backfill"

    [accounting]
    # Put the real URL, with its password, in a Secret named spur-config and
    # mount that instead of this ConfigMap. See spurctld.yaml. Leave empty to
    # run without accounting.
    database_url = ""

    [[partitions]]
    name = "default"
    state = "UP"
    default = true
    nodes = "ALL"
    max_time = "7d"
    default_time = "1h"
