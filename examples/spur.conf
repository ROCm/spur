cluster_name = "mi300x-cluster"

[controller]
listen_addr = "[::]:6817"
state_dir = "/var/spool/spur"
# Maximum automatic requeues before a job is held (default 5).
max_batch_requeue = 5
# Upper bound in seconds on the hold between launch-failure retries (default
# 300, range 1-86400). Each retry waits twice as long as the last, so this caps
# how far the doubling can go before max_batch_requeue is reached.
max_launch_backoff_secs = 300
# Hold a job instead of retrying it when its prolog fails (default true). A
# prolog sees the job's own context, so the same failure repeats on every node
# and each retry would drain another one. Set false to retry instead, bounded by
# max_batch_requeue. Slurm's inverse of this is
# SchedulerParameters=nohold_on_prolog_fail.
hold_on_prolog_fail = true
# How much of another user's job an identified non-owner (non-admin) may read
# back from get_job / scontrol show job. "redacted" (default) shows identity/
# state/timing/account but blanks work_dir, command, stdio paths, and the
# allocated nodelist; "owner_only" hides other users' jobs entirely; "full" is
# the legacy unscoped behaviour. Owners and admins always see the full record.
# Scoping applies only to identified callers, so it takes effect under
# auth.mode = required (or a credential presented under permissive); with auth
# disabled or no credential, the full record is returned.
# job_info_visibility = "redacted"
# Controller hostname(s). For an HA quorum, list every controller so clients
# and agents fail over to a surviving node if one is unreachable. Each host is
# combined with the port from listen_addr. Equivalent to a comma-separated
# SPUR_CONTROLLER_ADDR (e.g. "http://ctrl1:6817,http://ctrl2:6817").
# hosts = ["ctrl1", "ctrl2", "ctrl3"]

[scheduler]
plugin = "backfill"
interval_secs = 1
max_jobs_per_cycle = 10000
fairshare_halflife_days = 14
# Highest base priority a non-admin may request (via --priority at submit or
# scontrol update). Requests above this are clamped down, not rejected; at submit
# the clamp is returned as a warning, on the scontrol update path (no response
# field) it is only logged. Defaults to the base priority (1000), so a non-admin
# can lower but not raise priority — matching Slurm, where boosting priority is
# operator-only. Raise it to grant users a band above the baseline. The ceiling
# applies only to identified non-admin callers: admins are exempt, and so are
# callers with no verified identity (auth.mode = disabled, or permissive with no
# credential), where the cluster trusts the client as before.
# max_user_priority = 1000

[accounting]
database_url = "postgresql://spur:spur@localhost/spur"
# Cluster-wide fallback QOS, applied when a job specifies no --qos and its
# association has no default QOS. Ensures a QOS (and its limits) always
# applies instead of running unenforced. Must name an existing QOS. Unset =
# no fallback.
# default_qos = "normal"
# Reject at submit any job that still has no QOS after the resolution chain
# (explicit --qos -> association default -> default_qos above). Mirrors
# Slurm's AccountingStorageEnforce=qos. Default false.
# require_qos = false

[auth]
plugin = "none"
# How strictly callers are authenticated: "disabled", "permissive" (default), or
# "required". Under permissive a request without a credential is allowed and the
# username it asserts is trusted, so identity-dependent rules (job ownership,
# reservation management) are advisory. Use "jwt" above with a jwt_key and
# mode = "required" to make them enforceable.
# mode = "permissive"

[[partitions]]
name = "gpu"
default = true
state = "UP"
nodes = "mi300,mi300-2"
max_time = "7-00:00:00"
default_time = "1:00:00"
min_nodes = 1
priority_tier = 1

# Partition membership can also use label selectors. A node matches if it
# satisfies the hostname pattern (nodes=) OR all key=value pairs in selector.
# Both can be specified — they form a union.
#
# [[partitions]]
# name = "inference"
# state = "UP"
# selector = { pool = "inference", gpu = "mi300x" }
# max_time = "1-00:00:00"

# Restrict partition access by account (allow_accounts / deny_accounts).
#
# [[partitions]]
# name = "research"
# allow_accounts = ["research", "faculty"]
# deny_accounts = ["student"]

[[nodes]]
names = "mi300"
cpus = 256
memory_mb = 2321924
gres = ["gpu:mi300x:8"]
# address = "10.44.0.2"   # optional default comm address before the agent registers

[[nodes]]
names = "mi300-2"
cpus = 256
memory_mb = 2321904
gres = ["gpu:mi300x:8"]
# address = "10.44.0.3"   # optional default comm address before the agent registers

# Node configs can also match by label selector instead of hostname pattern.
# Features and weight from matching configs are applied at registration.
#
# [[nodes]]
# selector = { gpu = "mi300x" }
# features = ["mi300x", "rocm6"]
# weight = 10

[network]
wg_enabled = false
agent_port = 6818
# reject_loopback_comm_addr = true   # optional: refuse agent registrations whose comm address is loopback or link-local

[logging]
level = "info"
format = "text"

# POSIX resource limits (RLIMIT_*) spurd applies to job steps at launch.
[rlimits]
# RLIMIT_MEMLOCK for job processes. "unlimited" (default) makes RDMA/NCCL work
# out of the box; "inherit" keeps whatever spurd inherited; a plain number caps
# it to that many bytes (e.g. "1073741824" for 1 GiB).
memlock = "unlimited"

# Lifecycle hook scripts. All optional; a fully-qualified path enables the hook.
# job_submit (shell) and job_submit_lua both run on the controller at submission
# and can accept, reject (message shown to the user), or modify the job
# (whitelisted fields only). Shell decides via exit code + JSON on stdout; Lua
# defines slurm_job_submit(job_desc, submit_uid) (Slurm job_submit/lua parity).
# If both are set, shell runs first, then Lua. See examples/hooks/job_submit.{sh,lua}.
#
# Operational notes for the submit hooks:
#   - The hook script must be an absolute path, owned by root or the controller
#     user, and not group/world-writable (it runs as the controller, which is
#     usually root). A bad path/permission fails at startup, not at first submit.
#   - Enforcement is at submission only. `scontrol update` does NOT re-run the
#     hook, so a policy like "cap walltime" is not re-applied to later edits.
#   - In an HA controller set the hook file is per-node config; keep the script
#     identical on every controller or policy will change on failover.
[hooks]
# job_submit = "/etc/spur/job_submit.sh"
# job_submit_lua = "/etc/spur/job_submit.lua"

# MPI plugin settings for `--mpi=pmix` jobs. Nightly tarballs ship
# spur_mpi_pmix.so under lib/spur/ (install.sh copies it next to bin/).
# Agents also need OpenPMIx (libpmix.so) and Open MPI at runtime.
[mpi]
plugin_dir = "/usr/lib/spur"
# pmix_plugin = "/usr/lib/spur/spur_mpi_pmix.so"  # override plugin path
pmix_tmpdir = "/tmp/spur-pmix"
pmix_min_version = "4.1.0"

# Native cluster (k0s) that SPUR provisions and owns: `spur k8s up/down`, spurd-owned k0s
# systemd units, GPU CDI on join. Disabled by default. This is the INVERSE of [kubernetes]
# (which lets SPUR run inside an existing k8s and accept SpurJob CRDs).
[cluster]
enabled = false
distro = "k0s"                # only k0s is supported today
pod_cidr = "10.42.0.0/16"     # Calico bird carves per-node /24s from this over the mesh
service_cidr = "10.43.0.0/16"
# cni = "kuberouter"          # or "calico" (mesh-native bird routing over WireGuard)
cni_mtu = 1450                # Calico MTU; leaves headroom for WireGuard overhead on the mesh
# control_plane_node = "head-node"   # empty = pick from inventory
storage_provisioner = "local-path"          # ships a default StorageClass so PVCs bind; or "none"
# local_path_dir = "/mnt/scratch/local-path"  # point local-path at a big disk (default: /var/lib/...)
