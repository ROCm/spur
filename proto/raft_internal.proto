syntax = "proto3";

package raft_internal;

service RaftInternal {
  rpc AppendEntries(RaftRequest) returns (RaftResponse);
  rpc Vote(RaftRequest) returns (RaftResponse);
  rpc InstallSnapshot(RaftRequest) returns (RaftResponse);
  // An older controller returns UNIMPLEMENTED, which deliberately keeps a
  // mixed cluster on the old-readable NodeStateChange bridge.
  rpc GetCapabilities(CapabilitiesRequest) returns (CapabilitiesResponse);
}

message RaftRequest {
  bytes payload = 1;
}

message RaftResponse {
  bytes payload = 1;
}

message CapabilitiesRequest {}

message CapabilitiesResponse {
  bool release_quarantine_v1 = 1;
}
