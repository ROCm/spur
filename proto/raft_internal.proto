syntax = "proto3";

package raft_internal;

service RaftInternal {
  rpc AppendEntries(RaftRequest) returns (RaftResponse);
  rpc Vote(RaftRequest) returns (RaftResponse);
  rpc InstallSnapshot(RaftRequest) returns (RaftResponse);
  // Lists the optional log-entry kinds this controller can apply. A controller
  // built before the RPC existed answers UNIMPLEMENTED.
  rpc Capabilities(RaftRequest) returns (RaftResponse);
}

message RaftRequest {
  bytes payload = 1;
}

message RaftResponse {
  bytes payload = 1;
}
